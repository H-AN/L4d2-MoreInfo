                    }
                    "start"
                    {
                        "classname" "point_template"
                        "targetname" "Boss_hitbox_spawner"
                        "hammer_id" "7774341"
                        "output" "OnEntitySpawned"
                    }
                    "finish"
                    {
                        "classname" "func_breakable"
                        "targetname" "Boss_hitbox"
                        "hammer_id" "7773983"
                        "output" "OnBreak"
                    }
                }
            }
        }
