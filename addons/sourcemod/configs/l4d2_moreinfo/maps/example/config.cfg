// TEMPLATE ONLY: not a tested map adaptation. The folder name "example" matches no map, so it is never loaded.
// 仅为模板：没有对应真实地图。文件夹名 example 不会匹配任何地图，所以不会被加载。
// Copy this folder to maps/<exact_map_name>/ and replace selectors using sm_moreinfo_dump / sm_moreinfo_probe.
// 用法：把整个文件夹复制为 maps/<准确的地图名>/，再用 sm_moreinfo_dump / sm_moreinfo_probe 查到的实体替换选择器。
// Finished example: maps/l4d2_ffvii_makoreactor/
// 完整成品示例：maps/l4d2_ffvii_makoreactor/
//
// Selector = "classname" + ("targetname" and/or "hammer_id"). Add "hammer_id" when several entities share a targetname.
// 选择器 = classname + targetname 和/或 hammer_id。多个实体同名时加上 hammer_id 区分。
// Signal = selector + "output" (e.g. OnTrigger, OnBreak, OnHitMin).
// 信号 = 选择器 + output（例如 OnTrigger、OnBreak、OnHitMin）。
"MoreInfo"
{
    // Map version / BSP hash, for your own reference.
    // 地图版本或 BSP 哈希，仅作记录。
    "map_version" "EXAMPLE"

    "bosses"
    {
        // Section name = boss id (must be unique).
        // 小节名 = Boss id，不能重复。
        "guardian"
        {
            // Name shown on the HUD and in the ranking.
            // HUD 和排名里显示的名字。
            "name" "守卫"
            // Unit shown after contribution numbers. Default: 有效伤害
            // 排名数值后面的单位，默认“有效伤害”。
            "unit" "有效伤害"
            // Optional: fight is cancelled without settlement when this fires.
            // 可选：触发后这场 Boss 战作废，不结算排名。
            "cancel"
            {
                "classname" "logic_relay"
                "targetname" "guardian_cancel"
                "output" "OnTrigger"
            }
            "phases"
            {
                "1"
                {
                    // health: HP is the entity health (func_breakable, func_physbox, ...).
                    // health：血量就是实体的 health 值（func_breakable、func_physbox 等）。
                    "model" "health"
                    // Fixed max HP. Omit it and use capture_max_on_start if the map scales HP by player count.
                    // 固定最大血量。地图按人数设置血量时不写它，改用 capture_max_on_start。
                    "max_hp" "12000"
                    // 1 = read the current HP as max HP when "start" fires. Needs "start".
                    // 1 = start 触发时把当前血量记为最大血量。需要配置 start。
                    // "capture_max_on_start" "1"
                    // Seconds to wait after "start" before reading HP (0-60), for maps that set HP with a delay.
                    // start 触发后等待多少秒再读血量（0-60），用于地图延迟设置血量的情况。
                    // "start_delay" "0.05"
                    // verified_sync: damage is credited to the attacker. Enable only after confirming HP changes right in the damage call.
                    // verified_sync：伤害记到攻击者名下。只有确认血量在受伤当下同步变化后才能用。
                    // unknown (default): HP is shown, but damage is not credited to anyone.
                    // unknown（默认）：只显示血量，不给任何人记贡献。
                    "attribution" "verified_sync"
                    // Entity holding the HP. It is also the hitbox when "hitboxes" is omitted.
                    // 存血量的实体。不写 hitboxes 时它同时作为受击体。
                    "health" { "classname" "func_breakable" "targetname" "guardian_body" }
                    // Optional: when the phase starts. Without it the phase starts once the health entity exists, and the ranking is marked partial.
                    // 可选：阶段开始信号。不写则血量实体一出现就开始，排名会标记为不完整。
                    "start"
                    {
                        "classname" "logic_relay"
                        "targetname" "guardian_initialized"
                        "output" "OnTrigger"
                    }
                    // Required: when the phase ends (the boss is defeated).
                    // 必填：阶段结束信号（Boss 被击败）。
                    "finish"
                    {
                        "classname" "func_breakable"
                        "targetname" "guardian_body"
                        "output" "OnBreak"
                    }
                }
                // More phases: "2" { ... }, same keys as "1".
                // 多阶段 Boss 继续写 "2" { ... }，键和 "1" 相同。
            }
            // Optional: credit scripted damage (no attacker, e.g. a "materia" button) to the player who triggered it.
            // caster = the player's signal (activator must be a survivor); apply = the output that removes
            // "amount" HP after "delay" seconds, within 3 s of caster. Without this section behavior is unchanged.
            // 可选：把没有攻击者的脚本伤害（例如“神器”按钮）记给触发它的玩家。
            // caster = 玩家触发的信号（触发者必须是生还者）；apply = 在 delay 秒后扣掉 amount 血量的输出，
            // 必须在 caster 之后 3 秒内触发。不写这一段时行为不变。
            // "credited"
            // {
            //     "nuke"
            //     {
            //         "label" "核弹"
            //         "caster" { "classname" "func_button" "targetname" "nuke_button" "output" "OnPressed" }
            //         "apply"
            //         {
            //             "1" { "classname" "logic_relay" "targetname" "nuke_relay" "output" "OnTrigger" "amount" "5000" "delay" "2" }
            //         }
            //     }
            // }
        }
        "counter_guardian"
        {
            "name" "计数器守卫"
            "unit" "地图血量点"
            "phases"
            {
                "1"
                {
                    // counter_down: HP is a math_counter counting down to counter_min.
                    // counter_down：血量是一个往下数到 counter_min 的 math_counter。
                    // counter_up: counts up from counter_min to counter_max (counter_max must be greater).
                    // counter_up：从 counter_min 往上数到 counter_max（counter_max 必须更大）。
                    "model" "counter_down"
                    "counter_min" "0"
                    "max_hp" "1000"
                    // Delayed / unverified I/O is deliberately not credited to a player.
                    // 延迟或未验证的 I/O 不记到玩家名下。
                    "attribution" "unknown"
                    // Counter models require a math_counter here.
                    // 计数器模式这里必须是 math_counter。
                    "health" { "classname" "math_counter" "targetname" "guardian_hp_counter" }
                    // Entities players actually shoot. Any section names.
                    // 玩家实际打的实体，小节名随意。
                    "hitboxes"
                    {
                        "body" { "classname" "func_breakable" "targetname" "counter_guardian_hitbox" }
                    }
                    "start"
                    {
                        "classname" "logic_relay"
                        "targetname" "counter_guardian_initialized"
                        "output" "OnTrigger"
                    }
                    "finish"
                    {
                        "classname" "math_counter"
                        "targetname" "guardian_hp_counter"
                        "output" "OnHitMin"
                    }
                }
            }
        }
    }

    // Rules for which server chat lines go to the HUD (used when l4d2_moreinfo_map_msg_filter_mode is 0).
    // 哪些服务器聊天消息显示到 HUD（l4d2_moreinfo_map_msg_filter_mode 为 0 时使用）。
    // "exclude": any rule's exclude text found anywhere rejects the message, checked before everything else.
    // exclude：消息里出现任意一条规则的 exclude 文本就不显示，优先于其他规则。
    // "prefix" / "contains": the first rule whose prefix starts the text and whose contains appears in it wins (case-insensitive).
    // prefix / contains：从上往下，第一条“以 prefix 开头且包含 contains”的规则生效（不区分大小写）。
    // "key": a new message with the same key replaces the old one at once (e.g. a countdown and its "opening" line).
    // key：key 相同的新消息立刻顶替旧消息（例如倒计时和随后的“正在开启”）。
    "messages"
    {
        "exclude_admin" { "exclude" "An administrator" }
        // Put specific rules before a generic prefix rule.
        // 具体的规则放在通用前缀规则前面。
        "doors" { "prefix" "**" "contains" "Doors" "key" "doors" }
        "boss" { "prefix" "**" "contains" "Boss" "key" "boss" }
        "map_notice" { "prefix" "**" }
    }
}
