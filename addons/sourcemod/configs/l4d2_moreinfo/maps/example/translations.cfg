// TEMPLATE ONLY: HUD translations for map `say` messages. Copy together with config.cfg.
// 仅为模板：地图 say 消息的 HUD 翻译。和 config.cfg 一起复制使用。
// Finished example: maps/l4d2_ffvii_makoreactor/translations.cfg
// 完整成品示例：maps/l4d2_ffvii_makoreactor/translations.cfg
//
// Section name: any unique id. 小节名：任意不重复的 id。
// en: original text without the surrounding ** / *** (case-insensitive, repeated spaces ignored).
// en：原文，去掉两边的 ** / ***（不区分大小写，多个空格视为一个）。
// zh: text shown on the HUD. Unmatched messages are shown in the original language.
// zh：HUD 上显示的译文。没有匹配到的消息按原文显示。
// {n}: at most one integer per message; the number is copied into zh. zh may drop it but cannot add one.
// {n}：每条最多一个整数，数字会原样填进 zh。zh 可以不写 {n}，但不能比 en 多。
// Countdown: with l4d2_moreinfo_map_msg_countdown 1, "{n} seconds/minutes" keeps counting down on the HUD.
// 倒计时：l4d2_moreinfo_map_msg_countdown 为 1 时，“{n} seconds/minutes”会在 HUD 上继续倒数。
"Translations"
{
    "doors_in"   { "en" "Doors will open in {n} seconds" "zh" "大门将在 {n} 秒后开启" }
    "doors_open" { "en" "Doors opening"                  "zh" "大门正在开启" }
    "boss_come"  { "en" "A boss has come to stop you"    "zh" "Boss 前来阻止你们" }
}
