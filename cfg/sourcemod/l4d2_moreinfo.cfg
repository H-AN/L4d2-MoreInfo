// ConVars for plugin "l4d2_moreinfo.smx"
// 插件 l4d2_moreinfo.smx 的控制台变量
// SourceMod only generates this file when it is missing; edits here are kept.
// SourceMod 只在文件不存在时自动生成；这里的修改不会被覆盖。


// Master switch
// 总开关
// Default: "1"  Range: 0-1
l4d2_moreinfo_enable "1"

// 0 off; 1 state; 2 detailed diagnostics
// 调试日志：0 关闭；1 状态；2 详细诊断
// Default: "0"  Range: 0-2
l4d2_moreinfo_debug "0"


// ---------- Boss health / Boss 血量 ----------

// Boss health HUD
// Boss 血量 HUD
// Default: "1"  Range: 0-1
l4d2_moreinfo_boss_hp_enable "1"

// Health hold seconds
// 最后一次打中 Boss 后，血量条继续显示的秒数
// Default: "3.0"  Range: 0.1-60
l4d2_moreinfo_boss_hp_hold "3.0"


// ---------- Contribution ranking / 贡献排名 ----------

// Contribution collection and settlement
// 收集 Boss 伤害贡献并在战斗结束时结算
// Default: "1"  Range: 0-1
l4d2_moreinfo_boss_rank_enable "1"

// Ranking HUD
// 在 HUD 上显示排名
// Default: "1"  Range: 0-1
l4d2_moreinfo_boss_rank_hud_enable "1"

// Ranking chat
// 在聊天框输出排名
// Default: "1"  Range: 0-1
l4d2_moreinfo_boss_rank_chat_enable "1"

// Seconds per ranking page
// HUD 排名每页（3 人）显示的秒数
// Default: "5.0"  Range: 1-30
l4d2_moreinfo_rank_page_time "5.0"

// Seconds the ranking stays on HUD
// 排名在 HUD 上显示的总秒数
// Default: "60.0"  Range: 5-300
l4d2_moreinfo_rank_hud_time "60.0"

// Seconds per chat line
// 聊天框排名每行的输出间隔秒数
// Default: "0.20"  Range: 0.1-2
l4d2_moreinfo_rank_chat_interval "0.20"

// Include bots 
// 排名包含电脑队友
// Default: "1"  Range: 0-1
l4d2_moreinfo_rank_include_bots "1"

// Show credited scripted damage (materia) in the ranking HUD region
// 神器等脚本伤害命中时，在排名 HUD 区域实时提示
// Default: "1"  Range: 0-1
l4d2_moreinfo_credit_notice_hud_enable "1"

// Print credited scripted damage (materia) to chat
// 神器等脚本伤害命中时，在聊天框提示
// Default: "1"  Range: 0-1
l4d2_moreinfo_credit_notice_chat_enable "1"

// Seconds a scripted damage notice stays on HUD
// 实时提示在 HUD 上停留的秒数
// Default: "6.0"  Range: 1-30
l4d2_moreinfo_credit_notice_hold "6.0"


// ---------- Map messages / 地图消息 ----------

// Map message HUD
// 把地图消息显示到 HUD
// Default: "1"  Range: 0-1
l4d2_moreinfo_map_msg_enable "1"

// 0 strict rules; 1 loose server chat
// 0 严格：只收 maps/<地图>/config.cfg 的 messages 规则匹配的消息；1 宽松：收所有服务器聊天消息
// Default: "0"  Range: 0-1
l4d2_moreinfo_map_msg_filter_mode "0"

// Message hold seconds (countdown messages use their own seconds)
// 普通消息显示秒数（倒计时消息显示到归零后 2 秒，不受此值影响）
// Default: "11.0"  Range: 0.1-60
l4d2_moreinfo_map_msg_hold "11.0"

// 1 hides map messages shown on HUD from chat
// 1 = 已显示到 HUD 的地图消息不再出现在聊天框
// Default: "0"  Range: 0-1
l4d2_moreinfo_map_msg_hide_chat "0"

// 1 adds a live countdown to 'N seconds/minutes' map messages
// 1 = 含“N 秒/分钟”的地图消息在 HUD 上实时倒计时
// Default: "1"  Range: 0-1
l4d2_moreinfo_map_msg_countdown "1"

// 1 shows map messages translated by maps/<map>/translations.cfg
// 1 = 按 maps/<地图>/translations.cfg 翻译后显示地图消息
// Default: "1"  Range: 0-1
l4d2_moreinfo_map_msg_translate "1"


// ---------- HUD slots / HUD 槽位 ----------
// Positions and sizes are in configs/l4d2_moreinfo/hud.cfg.
// 各槽位的位置和大小在 configs/l4d2_moreinfo/hud.cfg 里设置。

// HUD refresh seconds
// HUD 刷新间隔秒数
// Default: "0.10"  Range: 0.05-1
l4d2_moreinfo_hud_interval "0.10"

// 0 write on change only; 1 rewrite owned HUD slots from the ~0.1 s timer; 2 rewrite them every game frame
// 0 = 只在内容变化时写入（1.0.1 的逻辑）；1 = 由约 0.1 秒一次的循环计时器重写本插件的 HUD 槽位；2 = 每帧重写（HUD 仍闪烁时使用）
// Default: "1"  Range: 0-2
l4d2_moreinfo_hud_frame_force "1"

// One HUD slot (0-14)
// Boss 血量用的 HUD 槽位（0-14）
// Default: "0"
l4d2_moreinfo_hud_boss_slot "0"

// Exactly two distinct HUD slots
// 地图消息用的两个不同 HUD 槽位
// Default: "1,2"
l4d2_moreinfo_hud_msg_slots "1,2"

// Title and three ranking slots
// 排名用的 4 个槽位：标题 + 3 行排名
// Default: "3,4,5,6"
l4d2_moreinfo_hud_rank_slots "3,4,5,6"
